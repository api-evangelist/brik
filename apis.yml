name: Brik
description: >-
  Brik ("[Re]Constructing Construction") is an Indonesian construction-materials
  company, backed by Accel, that operates concrete batching plants and supplies
  ready-mix concrete for building and infrastructure projects across the Greater
  Jakarta region, including Bekasi, Bogor, Karawang, and Bandung. Its product line
  spans standard ready-mix batches and higher-performance "Super Concrete" variants
  used for mass-concrete pours. At the time of enrichment Brik publishes no public
  developer API, OpenAPI specification, SDKs, or webhook surface; this record is
  maintained in the API Evangelist network as a company profile.
